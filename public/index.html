<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theo dõi học tập</title>
<link rel="preconnect" href="[https://fonts.googleapis.com](https://fonts.googleapis.com)">
<link rel="preconnect" href="[https://fonts.gstatic.com](https://fonts.gstatic.com)" crossorigin>
<link href="[https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap](https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap)" rel="stylesheet">
<style>
:root {
  --ink: #0F172A;
  --muted: #64748B;
  --bg-phone: #F8FAFC;
  --card: #FFFFFF;
  --line: #F1F5F9;
  --purple: #6366F1;
  --purple-dark: #4F46E5;
  --purple-light: #EEF2FF;
  --pink: #EC4899;
  --teal: #10B981;
  --orange: #F97316;
  --blue: #3B82F6;
  --yellow: #F59E0B;
  --red: #EF4444;
  --shadow-sm: 0 2px 10px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 12px 24px -6px rgba(99, 102, 241, 0.28);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #E0E7FF 0%, #FCE7F3 100%);
  font-family: "Be Vietnam Pro", system-ui, -apple-system, sans-serif;
  color: var(--ink);
  padding: 12px;
}
button, input, select { font: inherit; }
.phone {
  width: 390px;
  height: 844px;
  max-height: 95vh;
  background: var(--bg-phone);
  border-radius: 44px;
  box-shadow: 0 25px 60px -15px rgba(15, 23, 42, 0.22), 0 0 0 8px #FFFFFF;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
}
header {
  padding: 36px 20px 12px;
  background: rgba(248, 250, 252, 0.9);
  backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 3;
}
header h1 { margin: 0; font-size: 23px; font-weight: 800; letter-spacing: -0.02em; }
header p { margin: 3px 0 0; color: var(--muted); font-size: 13px; font-weight: 500; }
main {
  flex: 1;
  overflow-y: auto;
  padding: 4px 18px 104px;
  scrollbar-width: none;
}
main::-webkit-scrollbar { display: none; }
.screen { display: none; }
.screen.on { display: block; }
.hero {
  border-radius: 22px;
  padding: 18px 20px;
  color: #fff;
  background: linear-gradient(135deg, var(--purple) 0%, #8B5CF6 55%, var(--pink) 100%);
  box-shadow: var(--shadow-md);
  margin-bottom: 6px;
}
.hero small { opacity: 0.9; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.hero b { display: block; font-size: 19px; margin-top: 4px; font-weight: 800; }
.bar { height: 7px; background: rgba(255, 255, 255, 0.28); border-radius: 99px; margin-top: 12px; overflow: hidden; }
.bar i { display: block; height: 100%; background: #fff; border-radius: 99px; transition: width 0.35s ease; }
.head-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 18px 2px 10px;
  gap: 8px;
}
.head-row b { font-size: 14px; font-weight: 700; color: #334155; }
.toolbar {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
  overflow-x: auto;
  scrollbar-width: none;
}
.toolbar::-webkit-scrollbar { display: none; }
.btn {
  background: var(--purple);
  color: #fff;
  border: 0;
  border-radius: 11px;
  padding: 7px 12px;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.btn.ghost { background: var(--purple-light); color: var(--purple-dark); }
.btn.danger { background: #FEE2E2; color: var(--red); }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  border-radius: 16px;
  padding: 12px 14px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.card .stripe { width: 4px; height: 32px; border-radius: 4px; flex: none; }
.card .txt { flex: 1; min-width: 0; }
.card .txt b {
  display: block;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card .txt span {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--muted);
  margin-top: 3px;
}
.card.done { opacity: 0.65; background: #F8FAFC; box-shadow: none; }
.card.done .txt b { text-decoration: line-through; color: var(--muted); }
.check {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  border: 2px solid #CBD5E1;
  display: grid;
  place-items: center;
  flex: none;
  color: #fff;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  background: #fff;
  padding: 0;
}
.card.done .check, .check.on { background: var(--teal); border-color: var(--teal); }
.x {
  background: none;
  border: 0;
  color: #CBD5E1;
  font-size: 15px;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 8px;
}
.x:hover { color: var(--red); background: #FEF2F2; }
.remind {
  background: #FFFBEB;
  border: 1px solid #FDE68A;
  border-radius: 14px;
  padding: 11px 14px;
  font-size: 12.5px;
  line-height: 1.45;
  margin-top: 10px;
  color: #92400E;
}
.remind b { color: #B45309; }
.chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 2px 2px 12px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chips button {
  border: 1px solid #E2E8F0;
  background: #fff;
  border-radius: 12px;
  padding: 7px 13px;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  color: var(--muted);
}
.chips button.on {
  background: var(--purple);
  color: #fff;
  border-color: var(--purple);
  box-shadow: 0 4px 10px rgba(99, 102, 241, 0.25);
}
.time {
  font-weight: 700;
  font-size: 11.5px;
  color: var(--purple-dark);
  background: var(--purple-light);
  padding: 5px 8px;
  border-radius: 8px;
  text-align: center;
  min-width: 52px;
  line-height: 1.25;
}
.empty {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  padding: 20px 12px;
  background: #fff;
  border: 1px dashed #CBD5E1;
  border-radius: 16px;
}
.kid {
  display: flex;
  align-items: center;
  gap: 14px;
  background: #fff;
  border-radius: 20px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
}
.avatar {
  width: 52px;
  height: 52px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--yellow), var(--orange));
  display: grid;
  place-items: center;
  font-size: 22px;
  color: #fff;
  font-weight: 800;
  flex: none;
}
.kid .info { flex: 1; }
.kid b { font-size: 16px; }
.kid span { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.stat-box {
  background: #fff;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  border-radius: 16px;
  padding: 14px;
}
.stat { margin-bottom: 12px; }
.stat:last-child { margin-bottom: 0; }
.stat .lbl { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.track { height: 8px; background: #F1F5F9; border-radius: 99px; overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 99px; transition: width 0.3s; }
details.settings-group {
  margin-top: 16px;
  background: #fff;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  border-radius: 16px;
  overflow: hidden;
}
details.settings-group summary {
  padding: 13px 16px;
  font-size: 13.5px;
  font-weight: 700;
  color: #334155;
  cursor: pointer;
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
details.settings-group summary::-webkit-details-marker { display: none; }
.settings-body { padding: 0 14px 14px; border-top: 1px solid var(--line); }
.setting {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 14px;
  margin-top: 10px;
  font-size: 13px;
  font-weight: 600;
}
select, input {
  border: 1px solid #CBD5E1;
  border-radius: 10px;
  padding: 8px 11px;
  background: #F8FAFC;
  font-size: 13.5px;
  color: var(--ink);
  outline: none;
}
select:focus, input:focus { border-color: var(--purple); background: #fff; }
nav {
  position: absolute;
  left: 14px;
  right: 14px;
  bottom: 14px;
  height: 66px;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.8);
  border-radius: 22px;
  box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 0 6px;
  z-index: 4;
}
nav button {
  background: none;
  border: 0;
  font-size: 11px;
  font-weight: 700;
  color: #94A3B8;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  padding: 6px 12px;
  border-radius: 14px;
}
nav button .ic {
  position: relative;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
}
nav button .ic svg {
  width: 22px;
  height: 22px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
nav .badge {
  position: absolute;
  top: -5px;
  right: -8px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 99px;
  background: var(--red);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #fff;
  font-style: normal;
}
nav .badge[hidden] { display: none; }
nav button.on { color: var(--purple); background: var(--purple-light); }
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(15, 23, 42, 0.4);
  display: none;
  align-items: flex-end;
  z-index: 10;
}
.overlay.on { display: flex; }
.sheet {
  background: #fff;
  width: 100%;
  border-radius: 26px 26px 0 0;
  padding: 20px 20px 26px;
}
.sheet h3 { margin: 0 0 14px; font-size: 17px; font-weight: 800; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
.field input, .field select { width: 100%; }
.sheet .actions { display: flex; gap: 10px; margin-top: 16px; }
.sheet .actions button { flex: 1; padding: 11px; border-radius: 12px; border: 0; font-weight: 700; cursor: pointer; font-size: 14px; }
.sheet .cancel { background: #F1F5F9; color: var(--ink); }
.sheet .save { background: var(--purple); color: #fff; }
.toast {
  position: absolute;
  top: 48px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: #fff;
  padding: 8px 16px;
  border-radius: 99px;
  font-size: 12.5px;
  font-weight: 600;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
  z-index: 20;
  white-space: nowrap;
}
.toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="phone">
  <header id="head"></header>
  <main id="main">
    <section class="screen" id="s-today"></section>
    <section class="screen" id="s-week"></section>
    <section class="screen" id="s-tomorrow"></section>
    <section class="screen" id="s-profile"></section>
  </main>
  <nav id="nav">
    <button data-s="today" class="on">
      <span class="ic">
        <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </span>Hôm nay
    </button>
    <button data-s="week">
      <span class="ic">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </span>Lịch học
    </button>
    <button data-s="tomorrow">
      <span class="ic">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <i class="badge" id="nbadge" hidden>0</i>
      </span>Ngày mai
    </button>
    <button data-s="profile">
      <span class="ic">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </span>Hồ sơ
    </button>
  </nav>
  <div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
  <div class="toast" id="toast"></div>
  <input type="file" id="csvFile" accept=".csv,text/csv" hidden>
</div>
<script>
const SUBJ = {"Toán":"#3B82F6","Tiếng Việt":"#EC4899","Tiếng Anh":"#10B981","Tự nhiên & Xã hội":"#F97316","Mỹ thuật":"#F59E0B","Khác":"#6366F1"};
const DAYS = ["Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy","Chủ Nhật"];
const TODAY = 1, TOMORROW = 2;
const KEY = "theodoihoctap-v1";
const DEFAULT = {
  child: {name:"Bé An", cls:"Lớp 3A", year:"2026-2027"},
  reminder: "19:00",
  tasks: [
    {id:1, t:"Làm bài tập Toán trang 45", s:"Toán", due:"today", time:"19:00", done:true},
    {id:2, t:"Đọc 10 phút sách Tiếng Việt", s:"Tiếng Việt", due:"today", time:"20:00", done:true},
    {id:3, t:"Ôn 10 từ vựng Tiếng Anh", s:"Tiếng Anh", due:"today", time:"20:30", done:false},
    {id:4, t:"Ký sổ liên lạc", s:"Khác", due:"tomorrow", time:"07:00", done:false}
  ],
  schedule: {
    0:[{id:11,time:"07:30",s:"Toán",room:"Phòng 3A"},{id:12,time:"08:30",s:"Tiếng Việt",room:"Phòng 3A"},{id:13,time:"10:00",s:"Tiếng Anh",room:"Phòng 2B"}],
    1:[{id:21,time:"07:30",s:"Tự nhiên & Xã hội",room:"Phòng 3A"},{id:22,time:"08:30",s:"Toán",room:"Phòng 3A"},{id:23,time:"10:00",s:"Mỹ thuật",room:"Phòng 1A"}],
    2:[{id:31,time:"07:30",s:"Tiếng Việt",room:"Phòng 3A"},{id:32,time:"09:30",s:"Mỹ thuật",room:"Phòng 1A"}],
    3:[{id:41,time:"07:30",s:"Toán",room:"Phòng 3A"}],
    4:[{id:51,time:"07:30",s:"Tiếng Anh",room:"Phòng 2B"}],
    5:[{id:52,time:"08:00",s:"Tiếng Anh",room:"Phòng 2B"}],
    6:[]
  },
  prep: [{id:61, t:"Hộp sữa buổi sáng", done:false}],
  autoChecked: {},
  habits: [],
  reminders: [],
  scores: [
    {id:71, s:"Toán", score:9, note:"Kiểm tra 15 phút", date:"2026-10-06"},
    {id:72, s:"Tiếng Việt", score:7, note:"Chính tả", date:"2026-10-08"},
    {id:73, s:"Tiếng Anh", score:8, note:"Từ vựng", date:"2026-10-09"}
  ],
  nextId: 100
};

function normalizeState(raw) {
  const d = JSON.parse(JSON.stringify(DEFAULT));
  if (!raw || typeof raw !== "object") return d;
  return Object.assign({}, d, raw, {
    child: Object.assign({}, d.child, raw.child || {}),
    tasks: Array.isArray(raw.tasks) ? raw.tasks : d.tasks,
    schedule: (raw.schedule && typeof raw.schedule === "object") ? raw.schedule : d.schedule,
    prep: Array.isArray(raw.prep) ? raw.prep : d.prep,
    autoChecked: (raw.autoChecked && typeof raw.autoChecked === "object") ? raw.autoChecked : {},
    habits: Array.isArray(raw.habits) ? raw.habits : [],
    reminders: Array.isArray(raw.reminders) ? raw.reminders : [],
    scores: Array.isArray(raw.scores) ? raw.scores : d.scores,
    nextId: Number(raw.nextId) || 100
  });
}

let S;
try { S = normalizeState(JSON.parse(localStorage.getItem(KEY))); } catch(e) { S = normalizeState(null); }
let TG = {};

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
  fetch("/api/state", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(S)}).catch(function(){});
}

async function loadServer() {
  try {
    const r = await fetch("/api/state");
    if (r.ok) {
      const j = await r.json();
      TG = j.telegram || {};
      if (j.state && Object.keys(j.state).length > 0) S = normalizeState(j.state);
    }
  } catch(e) {}
  render();
}

async function tgPost(u, body, ok) {
  try {
    const r = await fetch(u, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Có lỗi xảy ra");
    toast(ok);
    await loadServer();
  } catch(e) { toast(e.message); }
}

function nid() { S.nextId = (S.nextId || 100) + 1; save(); return S.nextId; }
let cur = "today", wk = TODAY;

const $ = function(id) { return document.getElementById(id); };
const esc = function(s) {
  return String(s === undefined || s === null ? "" : s).replace(/[&<>"]/g, function(c) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
};
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(t._h);
  t._h = setTimeout(function() { t.classList.remove("on"); }, 1500);
}

function openForm(title, fields, onSave) {
  let html = "<h3>" + esc(title) + "</h3>";
  fields.forEach(function(f) {
    html += '<div class="field"><label>' + esc(f.label) + '</label>';
    if (f.type === "select") {
      html += '<select name="' + f.k + '">' + f.options.map(function(o) {
        return '<option ' + (o === f.value ? "selected" : "") + '>' + esc(o) + '</option>';
      }).join("") + '</select>';
    } else {
      html += '<input name="' + f.k + '" type="' + (f.type || "text") + '" value="' + esc(f.value || "") + '" placeholder="' + esc(f.ph || "") + '">';
    }
    html += '</div>';
  });
  html += '<div class="actions"><button class="cancel" data-sheet="cancel">Huỷ</button><button class="save" data-sheet="save">Lưu</button></div>';
  $("sheet").innerHTML = html;
  $("overlay").classList.add("on");
  const first = $("sheet").querySelector("input,select");
  if (first) setTimeout(function() { first.focus(); }, 50);
  $("sheet").onclick = function(e) {
    const b = e.target.closest("[data-sheet]");
    if (!b) return;
    if (b.dataset.sheet === "cancel") { closeSheet(); return; }
    const vals = {};
    fields.forEach(function(f) { vals[f.k] = $("sheet").querySelector('[name="' + f.k + '"]').value.trim(); });
    if (fields.some(function(f) { return f.required && !vals[f.k]; })) { toast("Vui lòng nhập đủ thông tin"); return; }
    onSave(vals); save(); closeSheet(); render();
  };
}
function closeSheet() { $("overlay").classList.remove("on"); }
$("overlay").addEventListener("click", function(e) { if (e.target.id === "overlay") closeSheet(); });
const subjOpts = Object.keys(SUBJ);

function renderWeek() {
  const items = (S.schedule[wk] || []).slice().sort(function(a,b) { return a.time.localeCompare(b.time); });
  return '<div class="head-row" style="margin-top:4px"><b>Lịch học theo thứ</b><button class="btn" data-act="addPeriod">+ Thêm tiết</button></div>' +
    '<div class="toolbar"><button class="btn ghost" data-act="weekRemind">+ Nhắc việc</button><button class="btn ghost" data-act="importCsv">Nhập CSV</button><button class="btn ghost" data-act="exportCsv">Xuất CSV</button></div>' +
    '<div class="chips">' + DAYS.map(function(d,i) { return '<button class="' + (i===wk?"on":"") + '" data-act="day" data-i="' + i + '">' + d + '</button>'; }).join("") + '</div>' +
    (items.length ? items.map(function(p) {
      return '<div class="card" data-act="editPeriod" data-id="' + p.id + '" style="cursor:pointer">' +
        '<div class="time">' + esc(p.time) + '</div>' +
        '<div class="stripe" style="background:' + (SUBJ[p.s] || "#6366F1") + '"></div>' +

const DAY_MAP = {"2":0,"thứ 2":0,"thứ hai":0,"3":1,"thứ 3":1,"thứ ba":1,"4":2,"thứ 4":2,"thứ tư":2,"5":3,"thứ 5":3,"thứ năm":3,"6":4,"thứ 6":4,"thứ sáu":4,"7":5,"thứ 7":5,"thứ bảy":5,"cn":6,"chủ nhật":6,"8":6};
function dayIndex(t) { const v = DAY_MAP[(t || "").toLowerCase().trim()]; return v === undefined ? -1 : v; }
function parseCsv(text) {
  const out = {}; let added = 0, skipped = 0;
  text.split(/\r?\n/).map(function(l) { return l.trim(); }).filter(Boolean).forEach(function(line, i) {
    const c = line.split(",").map(function(x) { return x.trim(); });
    const d = dayIndex(c[0]);
    if (d < 0) { if (i === 0) return; skipped++; return; }
    if (!/^\d{1,2}:\d{2}$/.test(c[1])) { skipped++; return; }
    const s = SUBJ[c[2]] ? c[2] : "Khác";
    (out[d] = out[d] || []).push({id:nid(), time:c[1].padStart(5,"0"), s:s, room:c[3]||""});
    added++;
  });
  return {out:out, added:added, skipped:skipped};
}
$("csvFile").addEventListener("change", function(e) {
  const f = e.target.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = function() {
    const res = parseCsv(String(reader.result));
    if (!res.added) { toast("File không có dòng tiết hợp lệ"); }
    else {
      Object.keys(res.out).forEach(function(d) { S.schedule[d] = res.out[d]; });
      save(); render();
      toast("Đã nhập " + res.added + " tiết");
    }
    e.target.value = "";
  };
  reader.readAsText(f, "utf-8");
});
function exportCsv() {
  const lines = ["Thứ,Giờ,Môn,Phòng"];
  DAYS.forEach(function(d, i) {
    (S.schedule[i] || []).slice().sort(function(a,b) { return a.time.localeCompare(b.time); }).forEach(function(p) {
      lines.push([d, p.time, p.s, (p.room || "").replace(/,/g, " ")].join(","));
    });
  });
  const blob = new Blob([lines.join("\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "thoi-khoa-bieu.csv"; a.click();
}

function dateOfWeekday(i) { const b = new Date(todayStr() + "T12:00:00"); const tw = (b.getDay() + 6) % 7; b.setDate(b.getDate() + (i - tw)); return b.toLocaleDateString("sv-SE"); }

const PRI = {"Cao":0, "Trung bình":1, "Thấp":2};
const PRI_COLOR = {"Cao":"#EF4444", "Trung bình":"#F59E0B", "Thấp":"#10B981"};
function taskDateC(t) {
  if (t.date) return t.date;
  const d = new Date(); if (t.due === "tomorrow") d.setTime(d.getTime() + 86400000);
  return d.toLocaleDateString("sv-SE", {timeZone:"Asia/Ho_Chi_Minh"});
}
function sortTasks(a,b) { return ((PRI[a.priority] !== undefined ? PRI[a.priority] : 1) - (PRI[b.priority] !== undefined ? PRI[b.priority] : 1)) || (a.time||"").localeCompare(b.time||""); }
function taskCard(t) {
  return '<div class="card ' + (t.done ? "done" : "") + '">' +
    '<div class="stripe" style="background:' + (PRI_COLOR[t.priority] || "#94A3B8") + '"></div>' +
    '<button class="check" data-act="toggleTask" data-id="' + t.id + '">' + (t.done ? "✓" : "") + '</button>' +
    '<div class="txt"><b>' + esc(t.t) + '</b><span>Ưu tiên ' + esc(t.priority || "Trung bình") + ' · ' + esc(dmy(t.date)) + ' ' + esc(t.time || "") + '</span></div>' +
    '<button class="x" data-act="delTask" data-id="' + t.id + '" title="Xoá">✕</button></div>';
}
function streak(h) {
  let n = 0; const d = new Date();
  const days = Array.isArray(h.days) ? h.days : [];
  for (;;) { const s = d.toLocaleDateString("sv-SE", {timeZone:"Asia/Ho_Chi_Minh"}); if (!days.includes(s)) break; n++; d.setTime(d.getTime() - 86400000); }
  return n;
}
function renderDaily() {
  S.habits = Array.isArray(S.habits) ? S.habits : [];
  const today = todayStr();
  const all = (S.tasks || []).map(function(t) { return Object.assign({}, t, {date:taskDateC(t)}); });
  const overdue = all.filter(function(t) { return !t.done && t.date < today; }).sort(sortTasks);
  const todayL = all.filter(function(t) { return t.date === today; }).sort(sortTasks);
  const later = all.filter(function(t) { return t.date > today; }).sort(function(a,b) { return a.date.localeCompare(b.date) || sortTasks(a,b); });
  const done = todayL.filter(function(t) { return t.done; }).length;
  const pct = todayL.length ? Math.round(done / todayL.length * 100) : 0;
  const section = function(title, list) { return list.length ? '<div class="head-row"><b>' + title + '</b></div>' + list.map(taskCard).join("") : ""; };
  const habits = S.habits.length ? S.habits.map(function(h) {
    const days = Array.isArray(h.days) ? h.days : [];
    const on = days.includes(today);
    return '<div class="card ' + (on ? "done" : "") + '">' +
      '<button class="check ' + (on ? "on" : "") + '" data-act="toggleHabit" data-id="' + h.id + '">' + (on ? "✓" : "") + '</button>' +
      '<div class="txt"><b>' + esc(h.name) + '</b><span>Chuỗi ' + streak(h) + ' ngày liên tiếp</span></div>' +
      '<button class="x" data-act="delHabit" data-id="' + h.id + '" title="Xoá">✕</button></div>';
  }).join("") : '<div class="empty">Chưa có thói quen nào. Bấm "+ Thêm" để rèn luyện mỗi ngày.</div>';
  return '<div class="hero"><small>Hôm nay · ' + esc(dmy(today)) + '</small>' +
    '<b>Hoàn thành ' + done + '/' + todayL.length + ' công việc</b>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div></div>' +
    (overdue.length ? '<div class="remind" style="background:#FEF2F2;border-color:#FECACA;color:#991B1B"><b style="color:#B91C1C">Chú ý:</b> Còn ' + overdue.length + ' việc quá hạn chưa hoàn thành.</div>' : "") +
    '<div class="head-row"><b>Việc cần làm hôm nay</b><button class="btn" data-act="addTask">+ Thêm việc</button></div>' +
    (todayL.length ? todayL.map(taskCard).join("") : '<div class="empty">Hôm nay chưa có việc nào.</div>') +
    section("Quá hạn chưa xong", overdue) +
    notifyHtml() +
    '<div class="head-row"><b>Thói quen hằng ngày</b><button class="btn ghost" data-act="addHabit">+ Thêm</button></div>' +
    habits +
    section("Công việc sắp tới", later) +
    settingsHtml();
}

function routineHtml() {
  if (!Array.isArray(S.reminders) || !S.reminders.length) {
    S.reminders = [{id:nid(), repeat:"daily", date:"", time:"19:00", t:"Học bài cũ", note:""}, {id:nid(), repeat:"daily", date:"", time:"20:00", t:"Làm bài tập", note:""}];
  }
  const items = S.reminders.slice().sort(function(a,b) { return (a.date||"9999").localeCompare(b.date||"9999") || (a.time||"").localeCompare(b.time||""); });
  return '<div class="head-row"><b>Tất cả lịch nhắc</b><button class="btn ghost" data-act="addRoutine">+ Thêm nhắc</button></div>' +
    (items.length ? items.map(function(r) {
      return '<div class="card"><div class="time">' + (r.repeat==="daily" ? "Hằng ngày" : esc(dmy(r.date).slice(0,5))) + '<br>' + esc(r.time) + '</div>' +
        '<div class="txt"><b>' + esc(r.t) + '</b><span>' + (r.note ? esc(r.note) : "Nhắc qua Telegram") + '</span></div>' +
        '<button class="x" data-act="delRoutine" data-id="' + r.id + '" title="Xoá">✕</button></div>';
    }).join("") : '<div class="empty">Chưa có lịch nhắc nào.</div>');
}

render();
loadServer();
</script>
</body>
</html>
