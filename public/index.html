<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A6AC8">
<title>Hành trình học tập</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;overflow-x:hidden;display:flex;align-items:center;justify-content:center;background:#D6E6F7;font-family:"Be Vietnam Pro",system-ui,-apple-system,sans-serif;color:#0F2C4D}
h1,h2,b,span,p,small{overflow-wrap:anywhere}
.phone{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;background:#EAF4FF;overflow:hidden;display:flex;flex-direction:column}
@media (min-width:520px){
  body{padding:16px}
  .phone{height:min(880px,calc(100vh - 32px));height:min(880px,calc(100dvh - 32px));border-radius:44px;box-shadow:0 25px 60px -15px rgba(15,44,77,.35),0 0 0 8px #fff}
}

button,input,select{font-family:'Be Vietnam Pro',system-ui,sans-serif}
.wrap{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:0 0 28px}
.wrap::-webkit-scrollbar{display:none}
.wrap.form{padding-bottom:104px}
.pad{padding:0 16px}
.ban{position:relative;overflow:hidden;background:#1A6AC8;padding:26px 18px 28px;color:#fff}
.ban::after{content:"";position:absolute;right:-50px;top:-60px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.08)}
.ban::before{content:"";position:absolute;right:40px;bottom:-80px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.06)}
.ban>*{position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.mark{width:26px;height:26px;border-radius:9px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:13px;font-weight:800}
.ban h1{margin:12px 0 0;font-size:28px;font-weight:800;line-height:1.2;letter-spacing:-.01em}
.ban p{margin:6px 0 0;font-size:12.5px;color:#FFFFFF}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:18px}
.cell{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:#DCEBFB;border:0;border-radius:20px;padding:14px;min-height:218px;justify-content:flex-start;box-shadow:0 6px 18px rgba(15,44,77,.08);color:#0F2C4D;cursor:pointer}
.ico{width:70px;height:70px;display:grid;place-items:center;margin:4px 0 8px -4px}
.ico svg{width:66px;height:66px;stroke:#14538F;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cell b{font-size:14.5px;font-weight:700}
.cell>span:not(.ico){font-size:11.5px;color:#44627F;line-height:1.45}
.sec{display:flex;align-items:center;gap:10px;padding:22px 0 10px}
.back{width:42px;height:42px;border:0;border-radius:13px;background:#fff;color:#0F2C4D;font-size:22px;font-weight:700;display:grid;place-items:center;flex:none;box-shadow:0 4px 12px rgba(15,44,77,.08);cursor:pointer}
.sec>div>b{display:block;font-size:20px;font-weight:800;color:#0F2C4D;line-height:1.25}
.sec>div>span{display:block;font-size:12px;color:#52708F;margin-top:2px}
.nav{position:absolute;left:0;right:0;bottom:0;height:72px;background:#fff;box-shadow:0 -4px 20px rgba(15,44,77,.08);display:flex;justify-content:space-around;align-items:center;padding:0 4px 6px;z-index:5}
.nb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:none;color:#52708F;font-size:10.5px;font-weight:700;padding:8px 2px;border-radius:14px;cursor:pointer}
.nb.on{color:#14538F}
.nb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:16px 18px;background:#1A6AC8;color:#fff;margin-bottom:6px}
.hero small{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.hero b{display:block;font-size:18px;font-weight:800;margin-top:3px}
.hero p{margin:4px 0 0;font-size:12px;color:#FFFFFF}
.hr{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 6px;min-height:40px;gap:8px}
.hr h2{margin:0;font-size:14px;font-weight:700;color:#14538F}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 14px;border:0;border-radius:12px;background:#1A6AC8;color:#fff;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap}
.btn.g{background:#E7F1FD;color:#14538F}
.btn.r{background:#FDE8E4;color:#B91C1C}
.card{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:10px 6px 10px 14px;margin-bottom:8px;box-shadow:0 4px 14px rgba(15,44,77,.07);color:#0F2C4D;min-height:60px;border:0;width:100%;text-align:left;font:inherit}
.card.click{cursor:pointer}
.tx{flex:1;min-width:0}
.tx>b{display:block;font-size:14px;font-weight:600;color:#0F2C4D}
.tx>span{display:block;font-size:12px;color:#52708F;margin-top:2px}
.time{flex:none;min-width:58px;text-align:center;padding:5px 8px;border-radius:9px;background:#E7F1FD;color:#14538F;font-size:11.5px;font-weight:700;line-height:1.3}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.s-toan{background:#2F6BDB}.s-viet{background:#C2417C}.s-anh{background:#1A6AC8}.s-tnxh{background:#C2810E}.s-mt{background:#7C5CC4}.s-khac{background:#52708F}
.xb{flex:none;width:44px;height:44px;border:0;background:none;color:#52708F;display:grid;place-items:center;padding:0;cursor:pointer;border-radius:12px;font-size:18px}
.ck{flex:none;width:44px;height:44px;margin:-10px 0 -10px -12px;border:0;background:none;display:grid;place-items:center;padding:0;cursor:pointer}
.bx{width:22px;height:22px;border-radius:7px;border:2px solid #6F8FB5;background:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff}
.bx.on{background:#1A6AC8;border-color:#1A6AC8}
.card.fin{background:#EAF2FB;box-shadow:none}
.card.fin .tx>b{text-decoration:line-through;color:#52708F}
.row{display:flex;gap:6px;margin-bottom:6px}
.chip{flex:1;min-width:0;min-height:54px;border:0;border-radius:13px;background:#fff;color:#52708F;font-weight:700;font-size:11.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(15,44,77,.06);cursor:pointer}
.chip.on{background:#1A6AC8;color:#fff}
.empty{text-align:center;color:#52708F;font-size:13px;padding:16px 12px;background:#fff;border:1px dashed #BBD3EE;border-radius:16px;margin-bottom:8px}
.seg{display:flex;gap:4px;padding:4px;border-radius:15px;background:#DCE9F7}
.seg button{flex:1;min-height:42px;border:0;background:none;border-radius:11px;color:#52708F;font-size:13px;font-weight:700;cursor:pointer}
.seg button.on{background:#fff;color:#14538F;box-shadow:0 2px 6px rgba(15,44,77,.12)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pc{background:#fff;border-radius:18px;padding:12px;text-align:center;box-shadow:0 4px 14px rgba(15,44,77,.07)}
.pc h3{margin:0 0 6px;font-size:13px;color:#14538F}
.pc p{margin:4px 0 0;font-size:11.5px;color:#52708F}
.bar{height:8px;border-radius:99px;background:#DCE9F7;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:#1A6AC8}
.rowb{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px;color:#0F2C4D}
.lb{display:block;font-size:12px;font-weight:700;color:#52708F;margin:12px 0 5px}
.fld{display:block;width:100%;min-height:46px;box-sizing:border-box;border:1px solid #6F8FB5;border-radius:12px;padding:8px 12px;background:#fff;font-size:14px;color:#0F2C4D}
.fld:focus{border-color:#1A6AC8;outline:none}
.two2{display:flex;gap:8px}.two2>div{flex:1;min-width:0}
.opt{flex:1;min-width:0;min-height:48px;border:1px solid #6F8FB5;border-radius:12px;background:#fff;color:#52708F;font-weight:700;font-size:12px;line-height:1.3;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.opt small{font-size:10px;font-weight:500}
.opt.on{background:#1A6AC8;border-color:#1A6AC8;color:#fff}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts .opt{flex:0 0 auto;padding:0 12px;min-height:40px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid #6F8FB5;border-radius:12px;padding:8px 8px 8px 12px;margin-top:12px;font-size:13px;font-weight:600;color:#0F2C4D;min-height:54px}
.tg{width:52px;height:44px;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer;flex:none}
.tg i{display:block;width:44px;height:26px;border-radius:99px;background:#1A6AC8;position:relative}
.tg i::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff}
.tg.off i{background:#BBD3EE}.tg.off i::after{right:21px}
.ft{position:absolute;left:0;right:0;bottom:0;padding:12px 18px 22px;background:#fff;border-top:1px solid #DCE9F7;display:flex;gap:10px;z-index:5}
.ft button{flex:1;min-height:48px;border:0;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer}
.ft .c1{background:#E7F1FD;color:#14538F}.ft .c2{background:#1A6AC8;color:#fff}
.err{margin:10px 2px 0;font-size:12.5px;font-weight:600;color:#B91C1C}
.msg{margin:8px 2px 0;font-size:12.5px;font-weight:600;color:#14538F}
.toast{position:absolute;top:18px;left:50%;transform:translateX(-50%);background:#0F2C4D;color:#fff;padding:9px 16px;border-radius:99px;font-size:12.5px;font-weight:600;z-index:30;max-width:90%;text-align:center}
.big{font-size:40px;font-weight:800;line-height:1.1}
.note{background:#fff;border-radius:16px;padding:12px 14px;font-size:13px;color:#0F2C4D;line-height:1.5;box-shadow:0 4px 14px rgba(15,44,77,.07)}
.kid{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 4px 14px rgba(15,44,77,.07)}
.av{width:52px;height:52px;border-radius:16px;background:#1A6AC8;color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;flex:none}
.grp2{background:#fff;border-radius:16px;box-shadow:0 4px 14px rgba(15,44,77,.07);overflow:hidden}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 8px 8px 14px;font-size:13.5px;font-weight:600;border-top:1px solid #EAF2FB;min-height:54px;color:#0F2C4D}
.kv:first-child{border-top:0}
.bars{display:flex;align-items:flex-end;gap:8px;height:96px}
.bars>div{flex:1;text-align:center;font-size:10.5px;color:#52708F}
.bars i{display:block;border-radius:6px 6px 0 0;background:#1A6AC8}
.bars i.d{border:1px dashed #8AA6C4;background:none;border-radius:4px}

.don{width:80%;max-width:94px;aspect-ratio:1/1;border-radius:50%;margin:0 auto;display:grid;place-items:center}
.don>span{width:72%;height:72%;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;color:#0F2C4D}
.bar i.s-toan{background:#2F6BDB}.bar i.s-viet{background:#C2417C}.bar i.s-anh{background:#1A6AC8}.bar i.s-tnxh{background:#C2810E}.bar i.s-mt{background:#7C5CC4}.bar i.s-khac{background:#52708F}
.menu{width:44px;height:44px;border:0;border-radius:13px;background:#fff;color:#0F2C4D;display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:0 4px 12px rgba(15,44,77,.10)}
.menu svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.menu.w{background:rgba(255,255,255,.22);color:#fff;box-shadow:none}
.brandrow{display:flex;align-items:center;gap:12px}
.ov{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(15,44,77,.45);z-index:20}
.drawer{position:absolute;left:0;top:0;bottom:0;width:min(284px,86%);background:#fff;z-index:21;border-radius:0 26px 26px 0;box-shadow:8px 0 30px rgba(15,44,77,.2);display:flex;flex-direction:column;padding:20px 14px 18px}
.dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.dh .brand{color:#14538F}
.dh .mark{background:#E7F1FD;color:#14538F}
.dx{width:44px;height:44px;border:0;background:#EAF4FF;border-radius:13px;color:#0F2C4D;font-size:18px;cursor:pointer;display:grid;place-items:center}
.kidbox{display:flex;align-items:center;gap:12px;background:#EAF4FF;border-radius:16px;padding:10px 12px;margin:8px 0 12px}
.kidbox .av{width:42px;height:42px;border-radius:13px;font-size:18px}
.kidbox b{display:block;font-size:14px;font-weight:700;color:#0F2C4D}
.kidbox small{display:block;font-size:11.5px;color:#52708F;margin-top:1px}
.mi{display:flex;align-items:center;gap:14px;min-height:52px;width:100%;border:0;background:none;border-radius:14px;padding:0 12px;font-size:14.5px;font-weight:700;color:#0F2C4D;text-align:left;cursor:pointer}
.mi.on{background:#E7F1FD;color:#14538F}
.mi svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dl{height:1px;background:#E3EEF9;margin:8px 4px}
.pad{min-width:0}
.card,.tx{min-width:0}
.row>*,.two2>div,.opts .opt{min-width:0}
.wrap{overflow-x:hidden}
.fld{font-size:16px}
.card.click{cursor:pointer}
input[type=date].fld,input[type=time].fld{min-height:46px}
</style>
</head>

const $ = id => document.getElementById(id);

const pad = n => String(n).padStart(2, "0");
function nowParts() {
  const d = new Date();
  const date = d.toLocaleDateString("sv-SE", {timeZone: TZ});
  const time = d.toLocaleTimeString("en-GB", {timeZone: TZ, hour: "2-digit", minute: "2-digit", hourCycle: "h23"});

}
const todayStr = () => nowParts().date;
function addDays(iso, n) { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toLocaleDateString("sv-SE"); }
const dmy = iso => iso ? iso.split("-").reverse().join("/") : "";
const dm = iso => iso ? iso.split("-").reverse().slice(0, 2).join("/") : "";
function wdIdx(iso) { return (new Date(iso + "T12:00:00").getDay() + 6) % 7; }
const wdName = iso => DAYS[wdIdx(iso)];
function weekStart(iso) { return addDays(iso, -wdIdx(iso)); }
function monthRange(iso) { const [y, m] = iso.split("-").map(Number); const last = new Date(y, m, 0).getDate(); return [y + "-" + pad(m) + "-01", y + "-" + pad(m) + "-" + pad(last)]; }
function addMonths(iso, n) { const [y, m, d] = iso.split("-").map(Number); const t = new Date(y, m - 1 + n, 1); const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate(); return t.getFullYear() + "-" + pad(t.getMonth() + 1) + "-" + pad(Math.min(d, last)); }
const fmt = n => (Math.round(n * 10) / 10).toFixed(1).replace(".", ",");
const num = v => String(v).replace(".", ",");
function parseTime(v) { const m = /^(\d{1,2}):(\d{2})$/.exec((v || "").trim()); if (!m || +m[1] > 23 || +m[2] > 59) return null; return pad(+m[1]) + ":" + m[2]; }
function defaultTime() { const h = +nowParts().time.slice(0, 2); return h < 23 ? pad(h + 1) + ":00" : "23:59"; }

function normalizeState(raw) {
  const d = JSON.parse(JSON.stringify(DEFAULT));
  if (!raw || typeof raw !== "object") return d;
  const out = Object.assign({}, d, raw);
  out.child = Object.assign({}, d.child, raw.child || {});
  out.tasks = Array.isArray(raw.tasks) ? raw.tasks : d.tasks;
  out.schedule = (raw.schedule && typeof raw.schedule === "object") ? raw.schedule : d.schedule;
  out.tutoring = Array.isArray(raw.tutoring) ? raw.tutoring : [];
  out.outside = Array.isArray(raw.outside) ? raw.outside : [];
  out.reminders = Array.isArray(raw.reminders) ? raw.reminders : [];
  if (Array.isArray(raw.results)) out.results = raw.results;
  else if (Array.isArray(raw.scores) && raw.scores.length) out.results = raw.scores.map(function (s, i) { return {id: s.id || (200 + i), subj: s.s || "Khác", score: Number(s.score) || 0, kind: s.note || "Bài kiểm tra", date: s.date || todayStr(), note: ""}; });
  else out.results = [];
  out.nextId = Number(raw.nextId) || 100;
  out.reminder = typeof raw.reminder === "string" ? raw.reminder : d.reminder;
  return out;
}

function visibleNotes() {
  // Việc lặp hằng tháng: chỉ hiện lần gần nhất chưa xong của mỗi chuỗi
  const seen = {}, out = [];
  notesList().slice().sort((a, b) => (a.date || "").localeCompare(b.date || "") || (a.time || "").localeCompare(b.time || "")).forEach(function (r) {
    if (r.done) { out.push(r); return; }

    out.push(r);

  return out;
}
function inRange(date, a, b) { return date >= a && date <= b; }
function ratio(items, isDone) { const total = items.length, done = items.filter(isDone).length; return {total: total, done: done, pct: total ? Math.round(done / total * 100) : 0}; }
function period(mode) { const t = todayStr(); return mode === "week" ? [weekStart(t), addDays(weekStart(t), 6)] : monthRange(t); }

  const donut = (title, r) => '<div class="pc"><h3>' + title + '</h3><div class="don" style="background:conic-gradient(#1A6AC8 ' + Math.round(r.pct * 3.6) + 'deg,#C9DFF8 0)"><span>' + r.pct + '%</span></div><p>' + (r.total ? r.done + "/" + r.total + " việc · chưa xong " + (100 - r.pct) + "%" : "Chưa có việc nào") + '</p></div>';

  }).join("") + '</div></div>';
  return h + '</div>';
}

  const r = S.results.find(x => x.id === UI.sel) || S.results[0];
  if (!r) return '<div class="pad"><div class="empty">Không tìm thấy kết quả.</div></div>';
  const same = S.results.filter(x => x.subj === r.subj), avg = same.reduce((a, x) => a + x.score, 0) / same.length, diff = r.score - avg;
  return '<div class="pad"><section class="hero"><small>Điểm số</small><div class="big">' + num(r.score) + '/10</div><p>' + (Math.abs(diff) < 0.05 ? "Bằng mức trung bình " : (diff > 0 ? "Cao hơn" : "Thấp hơn") + " trung bình ") + esc(r.subj) + ' (' + fmt(avg) + ')</p></section>' +
    '<div class="hr"><h2>Nhận xét của cô</h2></div><div class="note">' + esc(r.note || "Chưa có nhận xét.") + '</div>' +
    '<div class="hr"><h2>Thông tin</h2></div><div class="grp2"><div class="kv"><span>Môn học</span><b>' + esc(r.subj) + '</b></div><div class="kv"><span>Loại bài</span><b>' + esc(r.kind) + '</b></div><div class="kv"><span>Ngày</span><b>' + esc(dmy(r.date)) + '</b></div></div>' +
    '<div class="row" style="margin-top:14px"><button class="btn g" style="flex:1" data-act="share">Chia sẻ</button><button class="btn r" style="flex:1" data-act="delResult" data-id="' + r.id + '">Xoá kết quả</button></div></div>';
}

function vForm(view) {
  const f = UI.form;
  let h = '<div class="pad">';
  if (view === "addLesson") {
    h += '<span class="lb">Loại lịch</span><div class="row">' + chips([{label: "Học chính", sub: "Tiết trên lớp"}, {label: "Phụ đạo", sub: "Học thêm"}, {label: "Hoạt động ngoài", sub: "Ngoại khoá"}], "fkind", f.kind) + '</div>' +
      field("Môn học hoặc tên hoạt động", "title", f.title) + '<span class="lb">Ngày trong tuần</span><div class="row">' + chips(SHORT, "fday", f.day) + '</div>' +
      '<div class="two2"><div>' + field("Giờ bắt đầu", "start", f.start, {type: "time"}) + '</div><div>' + field("Giờ kết thúc", "end", f.end, {type: "time"}) + '</div></div>' + field("Phòng học hoặc địa điểm", "room", f.room);
  } else if (view === "addNote") {
    h += field("Tên việc", "tname", f.tname, {ph: "VD: Họp phụ huynh"}) + '<span class="lb">Chọn nhanh</span><div class="opts">' + chips(QUICK, "fquick", QUICK.indexOf(f.tname)) + '</div>' +
      '<div class="two2"><div>' + field("Ngày", "tdate", f.tdate, {type: "date"}) + '</div><div>' + field("Giờ", "ttime", f.ttime, {type: "time"}) + '</div></div>' + field("Địa điểm (không bắt buộc)", "tplace", f.tplace) +
      toggle("tremind", f.tremind, "Nhắc trước 1 ngày") + toggle("tmonthly", f.tmonthly, "Lặp lại hằng tháng");
  } else if (view === "addResult") {
    h += '<label class="lb" for="f-rsubj">Môn học</label><select class="fld" id="f-rsubj" name="rsubj">' + SUBJ_ORDER.map(s => '<option' + (s === f.rsubj ? " selected" : "") + '>' + esc(s) + '</option>').join("") + '</select>' +
      '<span class="lb">Điểm số (0 – 10)</span><div class="row">' + chips(["6", "7", "8", "9", "10"], "fscore", ["6", "7", "8", "9", "10"].indexOf(String(f.rscore))) + '</div>' +
      '<input class="fld" name="rscore" type="text" inputmode="decimal" value="' + esc(f.rscore) + '" placeholder="Hoặc nhập điểm, ví dụ 8,5" aria-label="Điểm số">' +
      '<div class="two2"><div>' + field("Loại bài", "rkind", f.rkind) + '</div><div>' + field("Ngày", "rdate", f.rdate, {type: "date"}) + '</div></div>' + field("Nhận xét của cô (không bắt buộc)", "rnote", f.rnote);
  } else if (view === "editChild") {
    h += field("Họ và tên", "cname", f.cname, {ph: "VD: Nguyễn Minh An"}) + field("Lớp", "ccls", f.ccls, {ph: "VD: Lớp 3A"}) + field("Năm học", "cyear", f.cyear, {ph: "VD: 2026-2027"});
  } else if (view === "addDone") {
    h += field("Việc của con", "dname", f.dname, {ph: "VD: Làm bài tập Toán trang 45"}) + '<div class="two2"><div>' + field("Ngày", "ddate", f.ddate, {type: "date"}) + '</div><div>' + field("Giờ", "dtime", f.dtime, {type: "time"}) + '</div></div>' + toggle("ddone", f.ddone, "Con đã hoàn thành việc này");
  }
  if (UI.err) h += '<p class="err" role="alert">' + esc(UI.err) + '</p>';
  return h + '</div>';
}

function drawer() {
  const item = (go, ic, t) => '<button class="mi' + (UI.view === go || (go === "results" && (UI.view === "detail" || UI.view === "addResult" || UI.view === "addDone")) || (go === "notes" && UI.view === "addNote") || (go === "schedule" && UI.view === "addLesson") || (go === "settings" && UI.view === "editChild") ? " on" : "") + '" data-go="' + go + '">' + IC[ic] + t + '</button>';
  return '<div class="ov" data-act="closeMenu"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Menu"><div class="dh"><div class="brand"><span class="mark" aria-hidden="true">H</span>Hành trình học tập</div><button class="dx" data-act="closeMenu" aria-label="Đóng menu">✕</button></div>' +
    '<div class="kidbox"><span class="av" aria-hidden="true">' + esc((S.child.name || "B").trim().split(" ").pop().charAt(0).toUpperCase()) + '</span><div><b>' + esc(S.child.name) + '</b><small>' + esc(S.child.cls + " · Năm học " + S.child.year) + '</small></div></div>' +
    item("home", "home", "Trang chủ") + item("schedule", "cal", "Đồng hành cùng con") + item("notes", "check", "Sổ tay cá nhân") + item("results", "star", "Kết quả") + item("review", "chart", "Đánh giá") + '<div class="dl"></div>' + item("settings", "gear", "Cài đặt") + '</aside>';
}

function render() {
  const v = UI.view, isForm = FORMS.indexOf(v) >= 0;
  let body;
  if (v === "home") body = vHome();
  else {
    const t = v === "detail" ? (function () { const r = S.results.find(x => x.id === UI.sel) || S.results[0] || {subj: "", score: 0, kind: "", date: ""}; return [r.subj + " · " + num(r.score) + "/10", r.kind + " · " + dmy(r.date)]; })() : TITLES[v];
    const view = {schedule: vSchedule, notes: vNotes, results: vResults, review: vReview, settings: vSettings, detail: vDetail}[v] || (() => vForm(v));
    body = '<div class="pad">' + secHead(v, t[0], t[1]) + '</div>' + view();
  }
  const main = $("main"), keep = main.scrollTop;
  main.className = "wrap" + (isForm ? " form" : "");
  main.innerHTML = body;
  main.scrollTop = keep;
  let layer = "";
  if (isForm) layer += '<div class="ft"><button class="c1" data-act="back">Huỷ</button><button class="c2" data-act="save">' + ({addLesson: "Lưu lịch học", addNote: "Lưu việc", addResult: "Lưu kết quả", addDone: "Lưu", editChild: "Lưu hồ sơ"}[v]) + '</button></div>';
  if (UI.menu) layer += drawer();
  $("layer").innerHTML = layer;
}
function go(view, extra) { UI.view = view; UI.menu = false; UI.err = ""; Object.assign(UI, extra || {}); render(); $("main").scrollTop = 0; }
function syncForm() { document.querySelectorAll("#main [name]").forEach(function (el) { if (el.name) UI.form[el.name] = el.value; }); }

/* ======================= Mở form ======================= */
function openForm(view, patch) {
  const t = todayStr();
  UI.form = Object.assign({kind: 0, title: "", day: UI.day, start: "07:30", end: "08:15", room: "",
    tname: "", tdate: t, ttime: defaultTime(), tplace: "", tremind: true, tmonthly: false,
    rsubj: "Toán", rscore: "8", rkind: "Kiểm tra 15 phút", rdate: t, rnote: "",
    dname: "", ddate: t, dtime: defaultTime(), ddone: true,
    cname: S.child.name || "", ccls: S.child.cls || "", cyear: S.child.year || ""}, patch || {});
  go(view);
}

/* ======================= Lưu ======================= */
function saveForm() {
  syncForm();
  const f = UI.form, v = UI.view;
  const fail = m => { UI.err = m; render(); };
  if (v === "addLesson") {
    const title = (f.title || "").trim(); if (!title) return fail("Vui lòng nhập môn học hoặc tên hoạt động.");
    const time = parseTime(f.start); if (!time) return fail("Giờ bắt đầu chưa đúng.");
    const end = f.end ? parseTime(f.end) : ""; if (f.end && !end) return fail("Giờ kết thúc chưa đúng.");
    const room = (f.room || "").trim();
    if (f.kind === 0) (S.schedule[f.day] = S.schedule[f.day] || []).push({id: nid(), time: time, end: end || "", s: title, room: room});
    else (f.kind === 1 ? S.tutoring : S.outside).push({id: nid(), day: f.day, time: time, end: end || "", title: title, note: room});
    UI.day = f.day; save(); go("schedule"); toast("Đã thêm lịch học"); return;
  }
  if (v === "addNote") {
    const name = (f.tname || "").trim(); if (!name) return fail("Vui lòng nhập tên việc.");
    if (!f.tdate) return fail("Vui lòng chọn ngày.");
    const time = parseTime(f.ttime); if (!time) return fail("Vui lòng chọn giờ.");
    const place = (f.tplace || "").trim(), series = f.tmonthly ? "s" + nid() : "";
    const n = f.tmonthly ? 12 : 1;
    for (let i = 0; i < n; i++) {
      const date = addMonths(f.tdate, i), id = nid();
      S.reminders.push({id: id, repeat: "none", date: date, time: time, t: name, note: place, done: false, series: series});
      if (f.tremind) S.reminders.push({id: nid(), repeat: "none", date: addDays(date, -1), time: S.reminder || "19:00", t: "Ngày mai: " + name, note: place, auto: true, pid: id, series: series});
    }
    save(); go("notes"); toast("Đã thêm việc"); return;
  }
  if (v === "addResult") {
    const sc = Number(String(f.rscore).replace(",", "."));
    if (String(f.rscore).trim() === "" || isNaN(sc) || sc < 0 || sc > 10) return fail("Điểm số cần nằm trong khoảng 0 đến 10.");
    if (!f.rdate) return fail("Vui lòng chọn ngày.");
    S.results.push({id: nid(), subj: f.rsubj, score: sc, kind: (f.rkind || "").trim() || "Bài kiểm tra", date: f.rdate, note: (f.rnote || "").trim()});
    save(); go("results"); toast("Đã ghi nhận kết quả"); return;
  }
  if (v === "editChild") {
    const name = (f.cname || "").trim(), cls = (f.ccls || "").trim(), year = (f.cyear || "").trim();
    if (!name) return fail("Vui lòng nhập họ và tên của con.");
    if (!cls) return fail("Vui lòng nhập lớp học.");
    if (year && !/^\d{4}\s*-\s*\d{4}$/.test(year)) return fail("Năm học nhập dạng 2026-2027.");
    S.child = Object.assign({}, S.child, {name: name, cls: cls, year: year.replace(/\s+/g, "")});
    save(); go("settings"); toast("Đã lưu hồ sơ của con"); return;
  }
  if (v === "addDone") {
    const name = (f.dname || "").trim(); if (!name) return fail("Vui lòng nhập việc của con.");
    if (!f.ddate) return fail("Vui lòng chọn ngày.");
    const time = parseTime(f.dtime); if (!time) return fail("Vui lòng chọn giờ.");
    S.tasks.push({id: nid(), t: name, date: f.ddate, time: time, priority: "Trung bình", done: !!f.ddone});
    save(); go("results"); toast(f.ddone ? "Đã ghi nhận việc con hoàn thành" : "Đã thêm việc của con"); return;
  }
}

/* ======================= CSV thời khoá biểu ======================= */
const DAY_MAP = {"2":0,"thứ 2":0,"thứ hai":0,"3":1,"thứ 3":1,"thứ ba":1,"4":2,"thứ 4":2,"thứ tư":2,"5":3,"thứ 5":3,"thứ năm":3,"6":4,"thứ 6":4,"thứ sáu":4,"7":5,"thứ 7":5,"thứ bảy":5,"cn":6,"chủ nhật":6,"8":6};
function dayIndex(t) { const v = DAY_MAP[(t || "").toLowerCase().trim()]; return v === undefined ? -1 : v; }
function parseCsv(text) {
  const out = {}; let added = 0;
  text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(function (line) {
    const c = line.split(",").map(x => x.trim()), d = dayIndex(c[0]);
    if (d < 0 || !/^\d{1,2}:\d{2}$/.test(c[1])) return;
    (out[d] = out[d] || []).push({id: nid(), time: c[1].padStart(5, "0"), s: SUBJ_CLS[c[2]] ? c[2] : "Khác", room: c[3] || ""});
    added++;
  });
  return {out: out, added: added};
}
function exportCsv() {
  const lines = ["Thứ,Giờ,Môn,Phòng"];
  DAYS.forEach(function (d, i) { (S.schedule[i] || []).slice().sort((a, b) => a.time.localeCompare(b.time)).forEach(p => lines.push([d, p.time, p.s, (p.room || "").replace(/,/g, " ")].join(","))); });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + lines.join("\n")], {type: "text/csv;charset=utf-8"}));
  a.download = "thoi-khoa-bieu.csv"; a.click();
}
$("csvFile").addEventListener("change", function (e) {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = function () {
    const res = parseCsv(String(rd.result).replace(/^\ufeff/, ""));
    if (!res.added) toast("File không có dòng tiết hợp lệ");
    else { Object.keys(res.out).forEach(d => { S.schedule[d] = res.out[d]; }); save(); render(); toast("Đã nhập " + res.added + " tiết"); }
    e.target.value = "";
  };
  rd.readAsText(f, "utf-8");
});

/* ======================= Sự kiện ======================= */
document.addEventListener("input", function (e) { if (e.target.name && FORM_LIVE()) UI.form[e.target.name] = e.target.value; });
function FORM_LIVE() { return FORMS.indexOf(UI.view) >= 0; }
document.addEventListener("change", function (e) {
  if (e.target.dataset && e.target.dataset.change === "reminderTime") { S.reminder = e.target.value; save(); toast("Đã đặt giờ nhắc " + S.reminder); }
  if (e.target.name === "rsubj") UI.form.rsubj = e.target.value;
});
document.addEventListener("click", function (e) {
  const g = e.target.closest("[data-go]");
  if (g) { go(g.dataset.go); return; }
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act, id = +el.dataset.id, i = +el.dataset.i;
  const upd = () => { syncForm(); };
  switch (a) {
    case "openMenu": UI.menu = true; render(); break;
    case "closeMenu": UI.menu = false; render(); break;
    case "back": go(BACK[UI.view] || "home"); break;
    case "day": UI.day = i; render(); break;
    case "mode": UI.mode = el.dataset.mode; render(); break;
    case "addLesson": openForm("addLesson", {kind: +el.dataset.kind, title: +el.dataset.kind === 0 ? "Toán" : ""}); break;
    case "addNote": openForm("addNote"); break;
    case "addResult": openForm("addResult"); break;
    case "addDone": openForm("addDone"); break;
    case "editChild": openForm("editChild"); break;
    case "fkind": upd(); UI.form.kind = i; if (i === 0 && !UI.form.title) UI.form.title = "Toán"; render(); break;
    case "fday": upd(); UI.form.day = i; render(); break;
    case "fquick": upd(); UI.form.tname = QUICK[i]; render(); break;
    case "fscore": upd(); UI.form.rscore = ["6", "7", "8", "9", "10"][i]; render(); break;
    case "tremind": upd(); UI.form.tremind = !UI.form.tremind; render(); break;
    case "tmonthly": upd(); UI.form.tmonthly = !UI.form.tmonthly; render(); break;
    case "ddone": upd(); UI.form.ddone = !UI.form.ddone; render(); break;
    case "save": saveForm(); break;
    case "delMain": S.schedule[UI.day] = (S.schedule[UI.day] || []).filter(x => x.id !== id); save(); render(); toast("Đã xoá tiết học"); break;
    case "delExtra": S.tutoring = S.tutoring.filter(x => x.id !== id); S.outside = S.outside.filter(x => x.id !== id); save(); render(); toast("Đã xoá"); break;
    case "tickNote": { const r = S.reminders.find(x => x.id === id); if (r) { r.done = !r.done; save(); render(); } break; }
    case "delNote": { const r = S.reminders.find(x => x.id === id); if (r) { S.reminders = S.reminders.filter(x => x.id !== id && x.pid !== id && !(r.series && x.series === r.series)); save(); render(); toast("Đã xoá việc"); } break; }
    case "tickTask": { const t = S.tasks.find(x => x.id === id); if (t) { t.done = !t.done; save(); render(); } break; }
    case "delTask": S.tasks = S.tasks.filter(x => x.id !== id); save(); render(); toast("Đã xoá"); break;
    case "openResult": go("detail", {sel: id}); break;
    case "delResult": S.results = S.results.filter(x => x.id !== id); save(); go("results"); toast("Đã xoá kết quả"); break;
    case "share": toast("Đã sao chép liên kết kết quả"); break;
    case "importCsv": $("csvFile").click(); break;
    case "exportCsv": exportCsv(); break;
    case "tgSave": tgPost("/api/telegram/token", {token: ($("tgToken") || {}).value}, "Đã lưu token"); break;
    case "tgDetect": tgPost("/api/telegram/detect", {}, "Đã kết nối với phụ huynh"); break;
    case "tgTest": tgPost("/api/telegram/test", {}, "Đã gửi tin thử"); break;
  }
});
document.addEventListener("visibilitychange", function () { if (!document.hidden && !UI.menu && FORMS.indexOf(UI.view) < 0) render(); });

render();
loadServer();
</script>
