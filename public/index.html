<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theo dõi học tập & Lịch thông báo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0F172A;
  --muted: #64748B;
  --bg-phone: #F8FAFC;
  --card: #FFFFFF;
  --line: #F1F5F9;
  --purple: #6366F1;
  --purple-dark: #4F46E5;
  --purple-light: #EEF2FF;
  --pink: #EC4899;
  --teal: #10B981;
  --orange: #F97316;
  --blue: #3B82F6;
  --yellow: #F59E0B;
  --red: #EF4444;
  --shadow-sm: 0 2px 10px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 12px 24px -6px rgba(99, 102, 241, 0.28);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #E0E7FF 0%, #FCE7F3 100%);
  font-family: "Be Vietnam Pro", system-ui, -apple-system, sans-serif;
  color: var(--ink);
  padding: 12px;
}
button, input, select { font: inherit; }
.phone {
  width: 390px;
  height: 844px;
  max-height: 95vh;
  background: var(--bg-phone);
  border-radius: 44px;
  box-shadow: 0 25px 60px -15px rgba(15, 23, 42, 0.22), 0 0 0 8px #FFFFFF;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
}
header {
  padding: 36px 20px 12px;
  background: rgba(248, 250, 252, 0.9);
  backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 3;
}
header h1 { margin: 0; font-size: 23px; font-weight: 800; letter-spacing: -0.02em; }
header p { margin: 3px 0 0; color: var(--muted); font-size: 13px; font-weight: 500; }
main {
  flex: 1;
  overflow-y: auto;
  padding: 4px 18px 104px;
  scrollbar-width: none;
}
main::-webkit-scrollbar { display: none; }
.screen { display: none; }
.screen.on { display: block; }
.hero {
  border-radius: 22px;
  padding: 18px 20px;
  color: #fff;
  background: linear-gradient(135deg, var(--purple) 0%, #8B5CF6 55%, var(--pink) 100%);
  box-shadow: var(--shadow-md);
  margin-bottom: 6px;
}
.hero small { opacity: 0.9; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.hero b { display: block; font-size: 19px; margin-top: 4px; font-weight: 800; }
.bar { height: 7px; background: rgba(255, 255, 255, 0.28); border-radius: 99px; margin-top: 12px; overflow: hidden; }
.bar i { display: block; height: 100%; background: #fff; border-radius: 99px; transition: width 0.35s ease; }
.head-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 18px 2px 10px;
  gap: 8px;
}
.head-row b { font-size: 14px; font-weight: 700; color: #334155; }
.toolbar {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
  overflow-x: auto;
  scrollbar-width: none;
}
.toolbar::-webkit-scrollbar { display: none; }
.btn {
  background: var(--purple);
  color: #fff;
  border: 0;
  border-radius: 11px;
  padding: 7px 12px;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.btn.ghost { background: var(--purple-light); color: var(--purple-dark); }
.btn.danger { background: #FEE2E2; color: var(--red); }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  border-radius: 16px;
  padding: 12px 14px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.card .stripe { width: 4px; height: 32px; border-radius: 4px; flex: none; }
.card .txt { flex: 1; min-width: 0; }
.card .txt b {
  display: block;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card .txt span {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--muted);
  margin-top: 3px;
}
.card.done { opacity: 0.65; background: #F8FAFC; box-shadow: none; }
.card.done .txt b { text-decoration: line-through; color: var(--muted); }
.check {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  border: 2px solid #CBD5E1;
  display: grid;
  place-items: center;
  flex: none;
  color: #fff;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  background: #fff;
  padding: 0;
}
.card.done .check, .check.on { background: var(--teal); border-color: var(--teal); }
.x {
  background: none;
  border: 0;
  color: #CBD5E1;
  font-size: 15px;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 8px;
}
.x:hover { color: var(--red); background: #FEF2F2; }
.remind {
  background: #FFFBEB;
  border: 1px solid #FDE68A;
  border-radius: 14px;
  padding: 11px 14px;
  font-size: 12.5px;
  line-height: 1.45;
  margin-top: 10px;
  color: #92400E;
}
.remind b { color: #B45309; }
.chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 2px 2px 12px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chips button {
  border: 1px solid #E2E8F0;
  background: #fff;
  border-radius: 12px;
  padding: 7px 12px;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  color: var(--muted);
  text-align: center;
  line-height: 1.25;
}
.chips button small {
  display: block;
  font-size: 10px;
  font-weight: 500;
  opacity: 0.8;
  margin-top: 2px;
}
.chips button.on {
  background: var(--purple);
  color: #fff;
  border-color: var(--purple);
  box-shadow: 0 4px 10px rgba(99, 102, 241, 0.25);
}
.time {
  font-weight: 700;
  font-size: 11.5px;
  color: var(--purple-dark);
  background: var(--purple-light);
  padding: 5px 8px;
  border-radius: 8px;
  text-align: center;
  min-width: 56px;
  line-height: 1.25;
}
.date-group {
  font-size: 12.5px;
  font-weight: 700;
  margin: 14px 4px 6px;
  color: var(--purple-dark);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.empty {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  padding: 20px 12px;
  background: #fff;
  border: 1px dashed #CBD5E1;
  border-radius: 16px;
}
.kid {
  display: flex;
  align-items: center;
  gap: 14px;
  background: #fff;
  border-radius: 20px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
}
.avatar {
  width: 52px;
  height: 52px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--yellow), var(--orange));
  display: grid;
  place-items: center;
  font-size: 22px;
  color: #fff;
  font-weight: 800;
  flex: none;
}
.kid .info { flex: 1; }
.kid b { font-size: 16px; }
.kid span { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.stat-box {
  background: #fff;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  border-radius: 16px;
  padding: 14px;
}
.stat { margin-bottom: 12px; }
.stat:last-child { margin-bottom: 0; }
.stat .lbl { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.track { height: 8px; background: #F1F5F9; border-radius: 99px; overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 99px; transition: width 0.3s; }
details.settings-group {
  margin-top: 16px;
  background: #fff;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  border-radius: 16px;
  overflow: hidden;
}
details.settings-group summary {
  padding: 13px 16px;
  font-size: 13.5px;
  font-weight: 700;
  color: #334155;
  cursor: pointer;
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
details.settings-group summary::-webkit-details-marker { display: none; }
.settings-body { padding: 0 14px 14px; border-top: 1px solid var(--line); }
.setting {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 14px;
  margin-top: 10px;
  font-size: 13px;
  font-weight: 600;
}
select, input {
  border: 1px solid #CBD5E1;
  border-radius: 10px;
  padding: 8px 11px;
  background: #F8FAFC;
  font-size: 13.5px;
  color: var(--ink);
  outline: none;
}
select:focus, input:focus { border-color: var(--purple); background: #fff; }
nav {
  position: absolute;
  left: 14px;
  right: 14px;
  bottom: 14px;
  height: 66px;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.8);
  border-radius: 22px;
  box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 0 6px;
  z-index: 4;
}
nav button {
  background: none;
  border: 0;
  font-size: 11px;
  font-weight: 700;
  color: #94A3B8;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 14px;
}
nav button .ic {
  position: relative;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
}
nav button .ic svg {
  width: 22px;
  height: 22px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
nav .badge {
  position: absolute;
  top: -5px;
  right: -8px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 99px;
  background: var(--red);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #fff;
  font-style: normal;
}
nav .badge[hidden] { display: none; }
nav button.on { color: var(--purple); background: var(--purple-light); }
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(15, 23, 42, 0.4);
  display: none;
  align-items: flex-end;
  z-index: 10;
}
.overlay.on { display: flex; }
.sheet {
  background: #fff;
  width: 100%;
  border-radius: 26px 26px 0 0;
  padding: 20px 20px 26px;
}
.sheet h3 { margin: 0 0 14px; font-size: 17px; font-weight: 800; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
.field input, .field select { width: 100%; }
.sheet .actions { display: flex; gap: 10px; margin-top: 16px; }
.sheet .actions button { flex: 1; padding: 11px; border-radius: 12px; border: 0; font-weight: 700; cursor: pointer; font-size: 14px; }
.sheet .cancel { background: #F1F5F9; color: var(--ink); }
.sheet .save { background: var(--purple); color: #fff; }
.toast {
  position: absolute;
  top: 48px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: #fff;
  padding: 8px 16px;
  border-radius: 99px;
  font-size: 12.5px;
  font-weight: 600;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
  z-index: 20;
  white-space: nowrap;
}
.toast.on { opacity: 1; }
</style>
</head>
<body>

  <main id="main">
    <section class="screen" id="s-today"></section>
    <section class="screen" id="s-week"></section>

    <section class="screen" id="s-profile"></section>
  </main>
  <nav id="nav">

      </span>Hôm nay
    </button>

      </span>Lịch thông báo
    </button>
    <button data-s="tomorrow">
      <span class="ic">
        <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>

      </span>Ngày mai
    </button>

      <span class="ic">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </span>Hồ sơ
    </button>
  </nav>
